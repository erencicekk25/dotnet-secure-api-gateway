# Full stack: gateway + sample services + Redis + PostgreSQL.
# Usage:  cp .env.example .env   (edit the values)   &&   docker compose up --build
#
# Network topology mirrors a zero-trust setup: only the gateway is published to the host.
# Downstream services and data stores live on an internal network with no route to the outside.

name: secure-gateway

services:
  gateway:
    build:
      context: .
      dockerfile: src/SecureGateway.Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${GATEWAY_ENVIRONMENT:-Staging}
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      ConnectionStrings__SecurityAudit: "Host=postgres;Port=5432;Database=secure_gateway;Username=gateway;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      DevTokenIssuer__Enabled: ${DEV_TOKEN_ISSUER_ENABLED:-true}
      RateLimiting__FailOpen: ${RATE_LIMIT_FAIL_OPEN:-true}
      ReverseProxy__Clusters__accounts__Destinations__primary__Address: "http://accounts-service:8080/"
      ReverseProxy__Clusters__payments__Destinations__primary__Address: "http://payments-service:8080/"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      accounts-service:
        condition: service_started
      payments-service:
        condition: service_started
    networks: [edge, backend]
    restart: unless-stopped

  accounts-service:
    build:
      context: .
      dockerfile: samples/Dockerfile
      args:
        SERVICE_PROJECT: SecureGateway.Samples.AccountsService
    networks: [backend]
    restart: unless-stopped

  payments-service:
    build:
      context: .
      dockerfile: samples/Dockerfile
      args:
        SERVICE_PROJECT: SecureGateway.Samples.PaymentsService
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d secure_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

networks:
  edge: {}
  backend:
    internal: true

volumes:
  postgres-data: {}
