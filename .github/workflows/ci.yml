name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SecureGateway.sln

      - name: Build
        run: dotnet build SecureGateway.sln -c Release --no-restore

      - name: Test
        run: dotnet test SecureGateway.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

  docker-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build gateway image
        run: docker build -f src/SecureGateway.Gateway/Dockerfile -t secure-gateway:ci .

      - name: Build sample service images
        run: |
          docker build -f samples/Dockerfile --build-arg SERVICE_PROJECT=SecureGateway.Samples.AccountsService -t accounts-service:ci .
          docker build -f samples/Dockerfile --build-arg SERVICE_PROJECT=SecureGateway.Samples.PaymentsService -t payments-service:ci .
